name: Build & Release EduToolBox

on:
  push:
    tags:
      - "V*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（应急手动发版，示例：V0.1.2-Canary）"
        required: true
        type: string
      version_type:
        description: "版本类型"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - beta
          - stable
      release:
        description: "创建GitHub Release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "标记为预发布版本"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📦 Set up Python & Install uv
        uses: astral-sh/setup-uv@v6

      - name: 🏷️ Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION_TYPE="${{ inputs.version_type }}"
            VERSION_TAG="${VERSION}"
          else
            VERSION_TAG="${{ github.ref_name }}"
            VERSION="${VERSION_TAG#V}"
            VERSION="${VERSION#v}"
            VERSION_TYPE="stable"

            if [[ "$VERSION_TAG" =~ -[Cc]anary ]]; then
              VERSION_TYPE="alpha"
            elif [[ "$VERSION_TAG" =~ -[Bb]eta ]]; then
              VERSION_TYPE="beta"
            fi
          fi

          if [[ ! "$VERSION_TYPE" =~ ^(alpha|beta|stable)$ ]]; then
            echo "Invalid version_type: $VERSION_TYPE" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          PRERELEASE="true"
          if [[ "$VERSION_TYPE" == "stable" ]]; then
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Resolved version: $VERSION"
          echo "Resolved version type: $VERSION_TYPE"
          echo "Resolved version tag: $VERSION_TAG"

      - name: 📝 Write version to source
        shell: bash
        env:
          CW_VERSION: ${{ steps.version.outputs.version }}
          CW_VERSION_TYPE: ${{ steps.version.outputs.version_type }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('main.py')
          content = path.read_text(encoding='utf-8')
          content = re.sub(r'__version__ = ["\'][^"\']*["\']', f'__version__ = "{os.environ["CW_VERSION"]}"', content)
          content = re.sub(r'__version_type__ = ["\'][^"\']*["\']', f'__version_type__ = "{os.environ["CW_VERSION_TYPE"]}"', content)
          path.write_text(content, encoding='utf-8')
          PY
          grep -E '^__version__|^__version_type__' main.py

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ github.workflow }}-

      - name: 📦 Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: 🔨 Build EduToolBox
        shell: bash
        run: |
          uv run pyinstaller main.py \
            --onedir \
            --name=EduToolBox \
            --collect-all RinUI \
            --collect-all PySide6 \
            --add-data "qml;qml" \
            --add-data "utils;utils" \
            --add-data "assets;assets" \
            --add-data "tools;tools"

      - name: 📦 Zip portable build
        shell: pwsh
        run: |
          $portable = "dist/EduToolBox/PORTABLE"
          New-Item -ItemType File -Path $portable -Force | Out-Null
          try {
            Compress-Archive -Path "dist/EduToolBox/*" -DestinationPath "dist/EduToolBox-Windows.zip"
          } finally {
            Remove-Item $portable -Force
          }

      - name: 🔧 Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: 🏗️ Build Windows Installer
        shell: cmd
        run: |
          set CW_VERSION=${{ steps.version.outputs.version }}
          iscc scripts\edutoolbox-cicd.iss

      - name: ☁️ Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduToolBox-Windows-Installer
          path: output/EduToolBox-*-Win-Installer.exe

      - name: ☁️ Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduToolBox-Windows
          path: dist/EduToolBox-Windows.zip

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION_TYPE="${{ inputs.version_type }}"
            VERSION_TAG="${VERSION}"
          else
            VERSION_TAG="${{ github.ref_name }}"
            VERSION="${VERSION_TAG#V}"
            VERSION="${VERSION#v}"
            VERSION_TYPE="stable"

            if [[ "$VERSION_TAG" =~ -[Cc]anary ]]; then
              VERSION_TYPE="alpha"
            elif [[ "$VERSION_TAG" =~ -[Bb]eta ]]; then
              VERSION_TYPE="beta"
            fi
          fi

          PRERELEASE="true"
          if [[ "$VERSION_TYPE" == "stable" ]]; then
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: 🧱 Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: 🏷️ Create local tag for CHANGELOG
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git tag "${{ steps.version.outputs.version_tag }}"

      - name: 📜 Generate CHANGELOG.md
        run: |
          git cliff --latest --tag "${{ steps.version.outputs.version_tag }}" --config .git-cliff.toml > CHANGELOG.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
        with:
          name: EduToolBox-${{ steps.version.outputs.version_tag }}
          tag_name: ${{ steps.version.outputs.version_tag }}
          body_path: CHANGELOG.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/EduToolBox-Windows.zip
            dist/EduToolBox-*-Win-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
